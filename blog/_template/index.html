<!DOCTYPE html>
<html lang="en" data-theme="light">

<!-- POST TEMPLATE — copy this directory to blog/<your-slug>/ and fill it in.
     The leading underscore keeps GitHub Pages from publishing it.
       1. cp -r blog/_template blog/<slug>
       2. Replace TITLE, DESCRIPTION, SLUG, and the date
       3. Add a row to blog/index.html (newest first)
       4. Add <url><loc>.../blog/<slug>/</loc></url> to sitemap.xml
     Body is just <p> and <h2>. If you ever need more, blog.css already
     styles <blockquote>, <ul>, <code>, <pre>, and <figure>/<figcaption>. -->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TITLE — Matthew Hong</title>
  <meta name="description" content="DESCRIPTION">
  <link rel="canonical" href="https://matthewh6.github.io/blog/SLUG/">
  <meta property="og:type" content="article">
  <meta property="og:title" content="TITLE">
  <meta property="og:description" content="DESCRIPTION">
  <meta property="og:url" content="https://matthewh6.github.io/blog/SLUG/">
  <meta property="og:image" content="https://matthewh6.github.io/images/profile-440.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TITLE">
  <meta name="twitter:description" content="DESCRIPTION">
  <meta name="twitter:image" content="https://matthewh6.github.io/images/profile-440.jpg">
  <script src="/main.js"></script>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/theme/theme.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/blog.css">
</head>

<body>
  <div class="wrap wrap--read">

    <div class="top top--nav">
      <a class="back" href="/blog/">← blog</a>
      <button id="theme-toggle" class="tt pill" type="button" aria-label="Toggle dark mode">◐</button>
    </div>

    <article class="post">
      <h1>TITLE</h1>
      <div class="meta">Matthew Hong · YYYY.MM.DD</div>

      <p>First paragraph.</p>

      <p>Second paragraph.</p>

      <p>Third paragraph.</p>
    </article>

    <footer><span class="swatches" aria-hidden="true"><i></i><i></i><i></i></span>updated 2026.10</footer>
  </div>
</body>

</html>
